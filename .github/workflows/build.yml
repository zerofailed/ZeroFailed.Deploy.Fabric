name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1

      - name: Setup PowerShell modules cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: ${{ runner.os }}-psmodules-${{ hashFiles('module/dependencies.psd1') }}
          restore-keys: |
            ${{ runner.os }}-psmodules-

      - name: Run Build
        shell: pwsh
        run: ./build.ps1 -Tasks FullBuild
        env:
          NUGET_API_KEY: ${{ secrets.FABRIC_NUGET_API_KEY }}

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pester Tests
          path: '**/testResults.xml'
          reporter: java-junit
